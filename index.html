<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#165b4e">
  <meta name="description" content="Synthetic Study App — No Live Data. KVN School OS v8a-c1.">
  <title>Synthetic Study App — No Live Data</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='14' width='64' height='64' fill='%23165b4e'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23d3a83f' stroke-width='7' stroke-dasharray='31 7 22 7 14 7'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23fff9ec'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true"></div>

  <dialog id="panelDialog" class="panel-dialog">
    <div id="panelContent"></div>
  </dialog>

  <dialog id="formDialog" class="form-dialog">
    <div id="formContent"></div>
  </dialog>

  <dialog id="sarasDialog" class="saras-dialog">
    <div class="dialog-head">
      <div>
        <p class="eyebrow">Approved school guidance</p>
        <h2>Saras Help</h2>
      </div>
      <button class="icon-button" data-close="sarasDialog" aria-label="Close Saras Help">×</button>
    </div>
    <div id="sarasMessages" class="saras-messages" aria-live="polite"></div>
    <form id="sarasForm" class="stack-form">
      <label for="sarasQuestion">Your question</label>
      <div class="saras-input-row"><input id="sarasQuestion" name="question" type="text" placeholder="Ask or describe the problem" autocomplete="off" required><button id="sarasMic" class="secondary-button mic-button" data-action="saras-mic" type="button" aria-pressed="false"><span class="mic-glyph" aria-hidden="true">🎙</span><span data-copy="Listen">Listen</span></button></div>
      <p id="sarasMicStatus" class="field-hint">Tap Listen and speak in the selected language. Browser permission is requested only after your tap.</p>
      <p class="field-hint">Saras answers from approved KVN guidance. New questions are routed to the responsible person.</p>
      <button class="primary-button" type="submit">Send</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
